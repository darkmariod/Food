<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monkey Food — Test Webhook</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5; display: grid; place-items: center;
      min-height: 100vh; padding: 16px;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 32px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08); width: 100%; max-width: 420px;
    }
    h1 { font-size: 22px; margin-bottom: 4px; color: #111; }
    p { font-size: 14px; color: #666; margin-bottom: 24px; }
    label { font-size: 13px; font-weight: 600; color: #333; display: block; margin-bottom: 6px; }
    input, select {
      width: 100%; padding: 10px 14px; border: 1px solid #ddd;
      border-radius: 10px; font-size: 15px; margin-bottom: 16px;
      background: #fafafa;
    }
    input:focus, select:focus { outline: none; border-color: #22c55e; background: #fff; }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: #22c55e; color: #fff; font-size: 16px; font-weight: 600;
      cursor: pointer; transition: background .2s;
    }
    button:hover { background: #16a34a; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #result {
      margin-top: 20px; padding: 16px; border-radius: 10px;
      font-size: 13px; font-family: monospace; white-space: pre-wrap;
      display: none; line-height: 1.5;
    }
    .success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; display: block; }
    .error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block; }
    .info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; display: block; }
    .steps { font-size: 13px; color: #555; margin: 16px 0; padding: 12px; background: #f9f9f9; border-radius: 8px; }
    .steps code { background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
<div class="card">
  <h1>🍲 Monkey Food</h1>
  <p>Test del webhook — simula un mensaje de WhatsApp</p>

  <div class="steps">
    <strong>Antes de probar:</strong><br>
    1. n8n corriendo en <code>localhost:5678</code><br>
    2. Workflow importado y <strong>ACTIVO</strong><br>
    3. Si no, abrí <code>http://localhost:5678</code> → activalo
  </div>

  <label for="message">Mensaje</label>
  <select id="message">
    <option value="menú">menú</option>
    <option value="hola">hola</option>
    <option value="menu">menu (sin tilde)</option>
    <option value="buenas">buenas</option>
    <option value="otra cosa">otra cosa (fallback)</option>
  </select>

  <label for="chatId">Chat ID (simulado)</label>
  <input id="chatId" type="text" value="593999999999@c.us" placeholder="593999999999@c.us">

  <label for="pushName">Nombre</label>
  <input id="pushName" type="text" value="Test" placeholder="Cliente">

  <button id="sendBtn" onclick="send()">🚀 Enviar a n8n</button>

  <div id="result"></div>
</div>

<script>
async function send() {
  const btn = document.getElementById('sendBtn');
  const resultDiv = document.getElementById('result');
  btn.disabled = true;
  btn.textContent = '⏳ Enviando...';
  resultDiv.style.display = 'none';

  const text = document.getElementById('message').value;
  const chatId = document.getElementById('chatId').value.trim();
  const pushName = document.getElementById('pushName').value.trim();

  const payload = {
    event: 'message',
    session: 'default',
    payload: {
      key: { remoteJid: chatId },
      message: { conversation: text },
      pushName
    }
  };

  try {
    const res = await fetch('http://localhost:5678/webhook/monkey-food-whatsapp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const text_res = await res.text();
    resultDiv.className = res.ok ? 'success' : 'error';
    resultDiv.textContent = `HTTP ${res.status}\n\n${text_res || '(sin cuerpo)'}`;
  } catch (err) {
    resultDiv.className = 'error';
    resultDiv.textContent = `❌ Error de conexión\n\n${err.message}\n\n¿n8n está corriendo en localhost:5678?`;
  }

  resultDiv.style.display = 'block';
  btn.disabled = false;
  btn.textContent = '🚀 Enviar a n8n';
}
</script>
</body>
</html>
