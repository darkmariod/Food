version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: app-food-backend:latest
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        action: replace
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-food-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: app-food-frontend:latest
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        action: replace
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-food-network

networks:
  app-food-network:
    driver: overlay
    attachable: true